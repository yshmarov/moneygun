# i18n-tasks config — https://github.com/glebm/i18n-tasks

base_locale: en
locales: [en, fr]

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/*.%{locale}.yml
  write:
    - config/locales/%{locale}.yml
  yaml:
    write:
      line_width: -1

search:
  exclude:
    - app/assets/images
    - app/assets/fonts
    - app/assets/videos
    - app/assets/builds

ignore_missing:
  - 'avo.*'
  - 'routes.*'
  - 'simple_form.*'

ignore_unused:
  - 'avo.action_translations.*'
  - 'notifiers.*'
  - 'activerecord.*'
  - 'activerecord.attributes.*'
  - 'activerecord.models.*'
  - 'errors.models.*'
  - 'errors.messages.*'
  - 'simple_form.*'
  - 'time.formats.*'
  - 'routes.*'
