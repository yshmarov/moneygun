plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - '**/db/schema.rb'
    - '**/db/**/*'
    - 'config/environments/**/*'
    - 'bin/*'
    - 'vendor/bundle/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - app/models/concerns/obfuscates_id.rb

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/ClassAndModuleChildren:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Rails/RenderInline:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false

Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false

Minitest/AssertPredicate:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

# important for erb lint not to remove opening <% tags in html.erb files

Layout/LeadingEmptyLines:
  Enabled: false

# would like to enable these later

Style/OpenStructUse:
  Enabled: false

Rails/OutputSafety:
  Enabled: false
