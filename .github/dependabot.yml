version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /
      - /.docker/postgres-backup
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - '*'
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
